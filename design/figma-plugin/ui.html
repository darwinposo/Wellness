<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, sans-serif; padding: 20px; background: #FAF8F5; }
  h2 { font-size: 15px; font-weight: 700; color: #1A1A22; margin-bottom: 6px; }
  p { font-size: 12px; color: #6E6E7E; margin-bottom: 16px; line-height: 1.5; }
  button {
    width: 100%; padding: 12px; background: #D4724A; color: #fff;
    border: none; border-radius: 10px; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: inherit; transition: background .15s;
  }
  button:hover:not(:disabled) { background: #C4623A; }
  button:disabled { opacity: 0.6; cursor: default; }
  #log {
    margin-top: 14px; font-size: 11px; color: #4A7D8C;
    max-height: 160px; overflow-y: auto; display: none;
    background: #fff; border-radius: 8px; padding: 10px;
    border: 1px solid #E2E2E8; line-height: 1.8;
  }
  #log.error { color: #D94F4F; }
  .warn { color: #D4724A; }
  .ok { color: #3D9A5C; }
</style>
</head>
<body>
  <h2>Reflect Design System</h2>
  <p>Creates Variables (Primitives, Semantic, Spacing), 5 text styles, and a Foundations page. Takes ~5 seconds.</p>
  <button id="run">Set Up Design System</button>
  <div id="log"></div>

  <script>
    const btn = document.getElementById('run');
    const logEl = document.getElementById('log');

    btn.addEventListener('click', () => {
      logEl.style.display = 'block';
      logEl.className = '';
      logEl.innerHTML = '⏳ Running…';
      btn.disabled = true;
      btn.textContent = 'Working…';
      parent.postMessage({ pluginMessage: { type: 'run' } }, '*');
    });

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'done') {
        btn.textContent = '✅ Done!';
        logEl.innerHTML = (msg.log || [])
          .map(l => {
            if (l.startsWith('✓')) return `<div class="ok">${l}</div>`;
            if (l.startsWith('⚠')) return `<div class="warn">${l}</div>`;
            if (l.startsWith('✅')) return `<div class="ok"><strong>${l}</strong></div>`;
            return `<div>${l}</div>`;
          }).join('') + `<div class="ok"><strong>${msg.message}</strong></div>`;
      }

      if (msg.type === 'error') {
        btn.textContent = 'Retry';
        btn.disabled = false;
        logEl.className = 'error';
        logEl.innerHTML = `<strong>Error:</strong> ${msg.message}<br><br>` +
          (msg.log || []).map(l => `<div>${l}</div>`).join('');
      }
    };
  </script>
</body>
</html>
