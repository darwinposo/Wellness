<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: Inter, sans-serif; padding: 20px; margin: 0; background: #FAF8F5; }
  h2 { font-size: 16px; font-weight: 700; color: #1A1A22; margin-bottom: 8px; }
  p { font-size: 13px; color: #6E6E7E; margin-bottom: 20px; line-height: 1.5; }
  button {
    width: 100%; padding: 14px; background: #D4724A; color: #fff;
    border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  button:hover { background: #C4623A; }
  #status { margin-top: 16px; font-size: 13px; color: #4A7D8C; display: none; }
</style>
</head>
<body>
  <h2>Reflect Design System</h2>
  <p>Creates all Variables (Primitives, Semantic Light/Dark, Spacing), 5 text styles, and the Foundations page automatically.</p>
  <button id="run">Set Up Design System</button>
  <div id="status">⏳ Setting up… this takes a few seconds.</div>

  <script>
    document.getElementById('run').addEventListener('click', () => {
      document.getElementById('status').style.display = 'block';
      document.getElementById('run').disabled = true;
      document.getElementById('run').textContent = 'Working…';
      parent.postMessage({ pluginMessage: { type: 'run' } }, '*');
    });

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (msg && msg.type === 'done') {
        document.getElementById('status').textContent = '✅ ' + msg.message;
        document.getElementById('run').textContent = 'Done!';
      }
      if (msg && msg.type === 'error') {
        document.getElementById('status').textContent = '❌ ' + msg.message;
        document.getElementById('status').style.color = '#D94F4F';
        document.getElementById('run').disabled = false;
        document.getElementById('run').textContent = 'Retry';
      }
    };
  </script>
</body>
</html>
